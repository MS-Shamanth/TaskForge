spring.application.name=TaskForge

# The API and WebSocket feed have no authentication, so listen on localhost only. To listen on all interfaces, start
# with --server.address=0.0.0.0, and only on a trusted network.
server.address=127.0.0.1

# Local development database from compose.yaml (dev-only credentials).
spring.datasource.url=jdbc:postgresql://localhost:5433/taskforge
spring.datasource.username=taskforge
spring.datasource.password=taskforge

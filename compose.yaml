services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskforge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  taskforge-data:
